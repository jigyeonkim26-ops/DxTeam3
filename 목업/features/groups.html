<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모임</title><link rel="stylesheet" href="../assets/mockup.css"></head><body><main class="shell"><header class="top"><a class="back" href="../index.html">‹</a><span class="eyebrow">MY GROUPS</span><a class="plain" href="create-group.html">＋</a></header><section class="content"><h1 class="title">함께 쌓는 장소</h1><p class="sub">참여 중인 모임의 기록은 모임 안에서만 볼 수 있어요. 피드는 하단 피드 탭에서 확인합니다.</p><a class="card" href="../index.html"><h3>연남 산책단 · 현재 선택됨</h3><p>멤버 3명 · 장소 8곳 · 오늘 새 기록 2개</p></a><a class="card" href="../index.html"><h3>동네 친구들</h3><p>멤버 5명 · 장소 14곳 · 새 기록 없음</p></a><div class="divider"></div><h3>모임 참여</h3><p class="sub">방장님에게 받은 초대 코드를 입력해 참여할 수 있어요. 카카오톡 초대 링크는 열면 바로 참여 확인 화면으로 연결됩니다.</p><form data-demo="초대 코드를 확인했어요. (목업 데이터)"><label class="label">초대 코드로 참여</label><input class="input" placeholder="예: YN-2026"><button class="secondary">코드로 참여하기</button></form></section></main><div class="toast"></div><script src="../assets/mockup.js"></script></body></html>
