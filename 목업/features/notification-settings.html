<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>알림 설정</title><link rel="stylesheet" href="../assets/mockup.css"><link rel="stylesheet" href="../assets/notifications.css"></head><body><main class="shell"><header class="top"><a class="back" href="profile.html">‹</a><span class="eyebrow">NOTIFICATION SETTINGS</span><span></span></header><section class="content"><h1 class="title">알림 설정</h1><p class="sub">원하는 소식만 받을 수 있도록 유형별로 조절하세요.</p><nav class="tabbar"><a href="notifications.html">알림함</a><a class="active" href="notification-settings.html">알림 설정</a></nav><div class="setting-group"><h3>기록 활동</h3><p>내 기록과 이어진 대화, 내가 참여하는 모임의 새 기록입니다.</p><label class="setting"><span><strong>댓글과 답글</strong><small>내 기록에 댓글이 달리거나 답글이 이어질 때</small></span><span class="switch"><input type="checkbox" checked data-notification-setting="comments"><i class="slider"></i></span></label><label class="setting"><span><strong>공감과 이어쓰기</strong><small>내 기록에 공감하거나 새 기록이 이어질 때</small></span><span class="switch"><input type="checkbox" checked data-notification-setting="memoryLinks"><i class="slider"></i></span></label><label class="setting"><span><strong>모임의 새 기록</strong><small>참여 중인 모임에 새 장소 기록이 올라올 때</small></span><span class="switch"><input type="checkbox" checked data-notification-setting="groupMemories"><i class="slider"></i></span></label></div><div class="setting-group"><h3>모임 소식</h3><label class="setting"><span><strong>모임 초대와 멤버 변경</strong><small>새 초대, 가입 승인, 멤버 변경 소식</small></span><span class="switch"><input type="checkbox" checked data-notification-setting="groupUpdates"><i class="slider"></i></span></label></div><div class="setting-group"><h3>장소 근처 리마인드</h3><p>저장된 장소 근처에 도착했을 때, 과거 기록을 다시 볼 수 있도록 알려줘요.</p><label class="setting"><span><strong>장소 근처 알림</strong><small>선택한 장소 반경 안에 들어왔을 때만 알림</small></span><span class="switch"><input type="checkbox" data-notification-setting="nearby"><i class="slider"></i></span></label><div class="permission-note">이 기능은 실제 앱에서 별도의 위치 권한 동의가 필요합니다. 이동 경로나 친구의 실시간 위치는 수집·공개하지 않으며, 목업에서는 설정 상태만 저장합니다.</div></div><div class="setting-group"><h3>방해 금지 시간</h3><div class="time-row"><select aria-label="시작 시간"><option>22:00</option><option>23:00</option></select><select aria-label="종료 시간"><option>08:00</option><option>09:00</option></select></div></div></section></main><div class="toast"></div><script src="../assets/mockup.js"></script><script src="../assets/notifications.js"></script></body></html>
