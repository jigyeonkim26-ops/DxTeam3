<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기록 작성</title><link rel="stylesheet" href="../assets/mockup.css"><link rel="stylesheet" href="../assets/camera.css"></head><body><main class="shell"><header class="top"><a class="back" href="../index.html">‹</a><span class="eyebrow">NEW MEMORY</span><span></span></header><section class="content"><h1 class="title">새로운 순간을<br>남겨볼까요?</h1><p class="sub">그 장소에서 직접 촬영한 사진과 기억을 남겨보세요.</p><form data-demo="기록을 저장했어요. 지도에서 확인해 보세요."><label class="label">사진</label><div class="camera-stage"><img id="photoPreview" alt="촬영한 사진 미리보기" hidden><span id="cameraEmpty" class="camera-empty"><label for="cameraInput" style="background:#163245;color:#fff;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer">눌러서 촬영</label></span></div><input class="camera-input" id="cameraInput" data-camera-input type="file" accept="image/*" capture="environment"><p class="sub">촬영 버튼을 누르면 모바일 브라우저의 카메라 권한 요청이 표시됩니다. 사진은 이 목업 화면에서만 미리보기로 사용됩니다.</p><label class="label">어디에서 보냈나요?</label><input class="input" value="연남동 작은 카페"><label class="label">누구와 나눌까요?</label><select class="input"><option>연남 산책단</option><option>동네 친구들</option></select><label class="label">방문일</label><input class="input" type="date" value="2026-09-22"><label class="label">이 순간을 한 줄로</label><textarea class="input" rows="4" placeholder="창가에 앉아 비가 그칠 때까지…"></textarea><button class="primary">기록 남기기</button></form></section></main><div class="toast"></div><script src="../assets/mockup.js"></script><script src="../assets/camera.js"></script></body></html>
