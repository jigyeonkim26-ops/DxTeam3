<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 모임 만들기</title><link rel="stylesheet" href="../assets/mockup.css"><link rel="stylesheet" href="../assets/invites.css"></head><body><main class="shell"><header class="top"><a class="back" href="groups.html">‹</a><span class="eyebrow">CREATE GROUP</span><span></span></header><section class="content"><h1 class="title">새 모임을<br>만들어볼까요?</h1><p class="sub">같이 장소를 기록할 친구들을 초대해 보세요. 모임 기록은 참여한 멤버만 볼 수 있어요.</p><form data-create-group><label class="label">모임 이름</label><input class="input" name="groupName" value="새로운 산책 모임" maxlength="30" required><label class="label">모임 소개</label><textarea class="input" rows="3" placeholder="예: 주말마다 동네의 좋은 장소를 기록해요."></textarea><label class="label">공유 범위</label><select class="input"><option>초대받은 멤버만</option><option>링크를 가진 사람은 참여 요청 가능</option></select><button class="primary" type="submit">모임 만들기</button></form><section id="inviteAfterCreate" hidden><div class="divider"></div><h3><span data-created-group-name>새 모임</span> 초대</h3><p class="sub">카카오톡으로 초대 링크를 공유하면, 친구는 링크를 열어 참여 여부를 확인할 수 있어요.</p><article class="invite-box"><h3>초대 코드</h3><p>짧은 코드를 직접 전달할 때 사용하세요.</p><code class="invite-value" data-code-value>NEW-2026</code><div class="invite-actions"><button type="button" data-generate-code>코드 생성</button><button type="button" data-copy-invite="[data-code-value]">코드 복사</button></div></article><article class="invite-box"><h3>카카오톡 공유 링크</h3><p>링크를 누르면 모임 참여 확인 화면으로 바로 연결됩니다.</p><code class="invite-value" data-link-value>join-group.html?code=NEW-2026</code><div class="invite-actions"><button type="button" data-generate-link>링크 생성</button><button type="button" data-copy-invite="[data-link-value]">링크 복사</button></div></article></section></section></main><div class="toast"></div><script src="../assets/mockup.js"></script><script src="../assets/invites.js"></script><script src="../assets/group-create.js"></script></body></html>
